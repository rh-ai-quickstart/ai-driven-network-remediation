# Service account for the nightly OpenShift e2e pipeline.
#
# Apply once with cluster-admin:
#   oc apply -f scripts/ci/ocp-service-account.yaml
#
# Then generate a long-lived token:
#   oc create token ci-nightly-runner -n ci-hub-telco-oran --duration=8760h
#
# Store the token as the OCP_TOKEN GitHub secret and the cluster API URL
# (oc whoami --show-server) as OCP_SERVER.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-hub-telco-oran
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-nightly-runner
  namespace: ci-hub-telco-oran
---
# Namespace-scoped admin — only ci-hub-telco-oran, no other namespace.
# The built-in 'admin' ClusterRole covers all resource types Helm charts
# may create (pods, services, deployments, secrets, PVCs, routes, custom
# resources, etc.) without granting any cluster-level privileges.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-nightly-runner-admin
  namespace: ci-hub-telco-oran
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: ci-nightly-runner
    namespace: ci-hub-telco-oran
