# ADNR edge Placement: selects ManagedClusters labeled adnr.io/role=edge.
# Label is applied by scripts/acm/label-spokes.sh (C7). Apply via
# scripts/acm/apply-placement.sh (substitutes __NAMESPACE__).
#
# ACM 2.17 / MCE 2.17 reject ManagedClusterSet selectorType=LabelSelector
# ("Do not allow to create/update this kind of clusterset"). Use exclusive
# membership via cluster.open-cluster-management.io/clusterset=adnr-edge
# (also set by label-spokes.sh once this set exists).
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSet
metadata:
  name: adnr-edge
  labels:
    app.kubernetes.io/part-of: adnr
    adnr.io/component: acm-placement
spec:
  clusterSelector:
    selectorType: ExclusiveClusterSetLabel
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: adnr-edge
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: adnr
    adnr.io/component: acm-placement
spec:
  clusterSet: adnr-edge
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: adnr-edge-spokes
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: adnr
    adnr.io/component: acm-placement
spec:
  clusterSets:
    - adnr-edge
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            adnr.io/role: edge
