# ADNR edge ApplicationSet: one Application per edge destination.
#
# Generator: list elements are rendered by scripts/acm/argocd-apply.sh.
# CLUSTER_COUNT>=2: elements come from hub/helm/spokes.generated.yaml
#   (ManagedCluster name = Argo destination name = siteId, edge-site-NN).
# CLUSTER_COUNT=1: one local element with destinationName=in-cluster and
#   siteId=edge-site-01 (demo/MCP alias); hub topology.spokes stays empty.
#
# Sample values / spokes below are valid for kubectl --dry-run=client. The apply
# script replaces the SPOKE_ELEMENTS block and substitutes repo/revision/kafka/
# healer image/CLF/selfHeal from env.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: adnr-edge
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: adnr
    adnr.io/component: argocd-edge
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          # SPOKE_ELEMENTS_START
          - name: edge-site-01
            siteId: edge-site-01
            namespace: dark-noc-edge
            destinationName: edge-site-01
          - name: edge-site-02
            siteId: edge-site-02
            namespace: dark-noc-edge
            destinationName: edge-site-02
          # SPOKE_ELEMENTS_END
  template:
    metadata:
      name: "adnr-edge-{{.name}}"
      # Cascade-prune edge resources when the Application is deleted (make teardown).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/part-of: adnr
        adnr.io/component: argocd-edge
        adnr.io/spoke: "{{.name}}"
        adnr.io/site-id: "{{.siteId}}"
    spec:
      project: adnr-edge
      source:
        repoURL: https://github.com/rh-ai-quickstart/ai-driven-network-remediation.git
        targetRevision: main
        path: edge/helm
        helm:
          releaseName: adnr-edge
          parameters:
            - name: siteId
              value: "{{.siteId}}"
            - name: namespace
              value: "{{.namespace}}"
            # SyncOption CreateNamespace owns the destination NS; skip chart Namespace.
            - name: createNamespace
              value: "false"
            - name: kafka.externalHost
              value: "__KAFKA_EXTERNAL_HOST__"
            - name: fastPathHealer.image.repository
              value: "__FAST_PATH_HEALER_IMAGE_REPO__"
            - name: fastPathHealer.image.tag
              value: "__FAST_PATH_HEALER_IMAGE_TAG__"
            - name: clusterLogForwarder.enabled
              value: "__CLUSTER_LOG_FORWARDER_ENABLED__"
      destination:
        # Spoke ManagedCluster name, or in-cluster for single-cluster GitOps.
        name: "{{.destinationName}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: __EDGE_SELF_HEAL__
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
      # Healer patches nginx memory and last-heal annotations at runtime.
      # Without this, selfHeal reverts the bump and hub skip cannot see the heal.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: edge-nginx
          jsonPointers:
            - /spec/template/spec/containers/0/resources
            - /spec/template/metadata/annotations
            - /metadata/annotations
