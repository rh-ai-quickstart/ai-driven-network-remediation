[project]
name = "edge-fast-path-healer"
version = "0.1.0"
description = "Spoke-local fast-path healer for known-safe nginx OOM remediation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "kubernetes>=31.0",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
edge-fast-path-watcher = "edge_fast_path_healer.watcher:main"
edge-fast-path-runner = "edge_fast_path_healer.runner:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
