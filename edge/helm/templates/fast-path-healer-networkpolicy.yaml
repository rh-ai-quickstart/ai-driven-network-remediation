{{- if and .Values.fastPathHealer.enabled .Values.fastPathHealer.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-fast-path-runner
  namespace: {{ include "adnr-edge.namespace" . }}
  labels:
    {{- include "adnr-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: edge-fast-path-runner
      {{- include "adnr-edge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edge-fast-path-watcher
              {{- include "adnr-edge.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.fastPathHealer.runner.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-fast-path-watcher
  namespace: {{ include "adnr-edge.namespace" . }}
  labels:
    {{- include "adnr-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: edge-fast-path-watcher
      {{- include "adnr-edge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: edge-fast-path-runner
              {{- include "adnr-edge.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.fastPathHealer.runner.port }}
{{- end }}
