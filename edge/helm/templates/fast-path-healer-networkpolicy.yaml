{{- if and .Values.fastPathHealer.enabled .Values.fastPathHealer.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-fast-path-runner
  namespace: {{ include "adnr-edge.namespace" . }}
  labels:
    {{- include "adnr-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: edge-fast-path-runner
      {{- include "adnr-edge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edge-fast-path-watcher
              {{- include "adnr-edge.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.fastPathHealer.runner.port }}
---
# Watcher egress must include kube API and DNS. An egress-only-to-runner
# policy times out on kubernetes.default.svc (connect timeout to 172.30.0.1:443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-fast-path-watcher
  namespace: {{ include "adnr-edge.namespace" . }}
  labels:
    {{- include "adnr-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: edge-fast-path-watcher
      {{- include "adnr-edge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: edge-fast-path-runner
              {{- include "adnr-edge.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.fastPathHealer.runner.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
