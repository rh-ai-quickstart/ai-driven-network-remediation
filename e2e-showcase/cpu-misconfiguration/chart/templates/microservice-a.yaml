{{- if .Values.microserviceA.enabled }}
{{- $registry := required "showcaseImage.registry is required (set REGISTRY)" .Values.showcaseImage.registry }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microserviceA.name }}
  labels:
    {{- include "cpu-misconfiguration.labels" . | nindent 4 }}
    app: {{ .Values.microserviceA.name }}
spec:
  replicas: {{ .Values.microserviceA.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.microserviceA.name }}
      {{- include "cpu-misconfiguration.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ .Values.microserviceA.name }}
        {{- include "cpu-misconfiguration.selectorLabels" . | nindent 8 }}
        adnr.io/site-id: {{ required "siteId is required (e.g. edge-01)" .Values.siteId | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.microserviceA.name }}
          image: "{{ $registry }}/{{ .Values.microserviceA.image.name }}:{{ .Values.showcaseImage.tag }}"
          imagePullPolicy: {{ .Values.showcaseImage.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.microserviceA.env.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.microserviceA.env.port | quote }}
            - name: MAX_QUEUE_SIZE
              value: {{ .Values.microserviceA.env.maxQueueSize | quote }}
            - name: MICROSERVICE_B_URL
              value: {{ .Values.microserviceA.env.microserviceBUrl | quote }}
            - name: MICROSERVICE_B_SITE_ID
              value: {{ .Values.microserviceA.env.microserviceBSiteId | quote }}
            - name: MICROSERVICE_B_VERIFY_SSL
              value: {{ .Values.microserviceA.env.microserviceBVerifySsl | quote }}
          resources:
            {{- toYaml .Values.microserviceA.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.microserviceA.name }}
  labels:
    {{- include "cpu-misconfiguration.labels" . | nindent 4 }}
    app: {{ .Values.microserviceA.name }}
spec:
  selector:
    app: {{ .Values.microserviceA.name }}
    {{- include "cpu-misconfiguration.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.microserviceA.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
