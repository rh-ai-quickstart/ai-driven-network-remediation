{{- $aap := dig "mcpSecrets" "aap" (dict) .Values.network }}
{{- if and (or .Values.network.enabled .Values.telco.enabled) (dig "create" true $aap) (not (get $aap "existingSecretName")) }}
apiVersion: v1
kind: Secret
metadata:
  name: noc-aap-secret
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  AAP_TOKEN: {{ get $aap "token" | default "" | b64enc | quote }}
{{- end }}
