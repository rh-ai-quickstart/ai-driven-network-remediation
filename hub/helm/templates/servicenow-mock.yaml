{{- $config := include "hub.servicenow" . | fromJson }}
{{- if $config.mock.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicenow-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app: servicenow-mock
    {{- include "hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicenow-mock
  template:
    metadata:
      {{- include "hub.servicenowCredentialAnnotation" $config.credentials | nindent 6 }}
      labels:
        app: servicenow-mock
    spec:
      containers:
        - name: servicenow-mock
          image: "{{ $config.mock.image.repository }}:{{ $config.mock.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            {{- include "hub.servicenowCredentialEnv" $config.credentials | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: servicenow-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app: servicenow-mock
    {{- include "hub.labels" . | nindent 4 }}
spec:
  selector:
    app: servicenow-mock
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
