# This Job runs as a post-install/post-upgrade hook because AAP credentials
# live in the AAP controller database and must be created via REST API.
#
# K8s resources (SA, ClusterRole, Secret) are declared in aap-remediation-rbac.yaml.
# This Job only reads the SA token and registers it as an AAP credential.
# The script itself lives in aap-credential-script-cm.yaml.
{{- if .Values.aapCredential.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hub.fullname" . }}-aap-credential
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: aap-credential-setup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "hub.fullname" . }}-aap-credential
      containers:
        - name: setup
          image: {{ .Values.edgeRbac.image | default "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest" }}
          env:
            - name: AAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpSecrets.aap.existingSecretName | default "noc-aap-secret" }}
                  key: AAP_TOKEN
            - name: AAP_VERIFY_SSL
              value: {{ index .Values "mcp-servers" "mcp-servers" "noc-aap" "env" "AAP_VERIFY_SSL" | quote }}
            {{- if .Values.aapCredential.multicluster.enabled }}
            - name: RHACM_CLUSTER_PROXY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.fullname" . }}-rhacm-multicluster
                  key: CLUSTER_PROXY_URL
            - name: RHACM_HUB_TOKEN_VAL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.fullname" . }}-rhacm-multicluster
                  key: RHACM_HUB_TOKEN
            {{- end }}
          command: ["/bin/bash", "/scripts/setup.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ include "hub.fullname" . }}-aap-credential-script
{{- end }}
