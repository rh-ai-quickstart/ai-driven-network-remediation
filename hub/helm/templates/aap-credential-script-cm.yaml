{{- if .Values.aapCredential.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hub.fullname" . }}-aap-credential-script
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
data:
  setup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    CURL_TLS_FLAG=""
    if [ "${AAP_VERIFY_SSL}" != "true" ]; then
      CURL_TLS_FLAG="-k"
    fi

    AAP_HOST="{{ include "hub.aapUrl" . }}"
    AAP_PREFIX="{{ index .Values "mcp-servers" "mcp-servers" "noc-aap" "env" "AAP_API_PREFIX" }}"
    ORG_ID="{{ .Values.aapCredential.organizationId }}"
    MULTICLUSTER_ENABLED="{{ .Values.aapCredential.multicluster.enabled }}"
    BASE_TMPL="{{ .Values.agentService.lightspeed.baseTemplateName }}"

    aap_get()  { curl -fs $CURL_TLS_FLAG "${AAP_HOST}${AAP_PREFIX}$1" -H "Authorization: Bearer ${AAP_TOKEN}"; }
    aap_post() { curl -fs $CURL_TLS_FLAG -X POST "${AAP_HOST}${AAP_PREFIX}$1" -H "Authorization: Bearer ${AAP_TOKEN}" -H "Content-Type: application/json" -d "$2"; }
    aap_patch(){ curl -fs $CURL_TLS_FLAG -X PATCH "${AAP_HOST}${AAP_PREFIX}$1" -H "Authorization: Bearer ${AAP_TOKEN}" -H "Content-Type: application/json" -d "$2"; }
    jq_count() { python3 -c "import sys,json; print(len(json.load(sys.stdin).get('results',[])))"; }
    jq_first_id() { python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])"; }
    urlenc() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"; }

    upsert_resource() {
      local endpoint="$1" name="$2" payload="$3"
      local resp count
      resp=$(aap_get "${endpoint}?name=$(urlenc "${name}")")
      count=$(echo "$resp" | jq_count)
      if [ "$count" = "0" ]; then
        aap_post "$endpoint" "$payload" | python3 -m json.tool
        echo "Created ${endpoint} '${name}'"
      else
        local rid
        rid=$(echo "$resp" | jq_first_id)
        aap_patch "${endpoint}${rid}/" "$payload" | python3 -m json.tool
        echo "Updated ${endpoint} '${name}' (id=${rid})"
      fi
    }

    attach_credential_to_template() {
      local cred_name="$1"
      echo "Attaching credential to template '${BASE_TMPL}'"
      local cred_id
      cred_id=$(aap_get "/credentials/?name=$(urlenc "${cred_name}")" | jq_first_id)
      local tmpl_id
      tmpl_id=$(aap_get "/job_templates/?name=$(urlenc "${BASE_TMPL}")" \
        | python3 -c "import sys,json; r=json.load(sys.stdin)['results']; print(r[0]['id'] if r else '')")
      if [ -n "$tmpl_id" ]; then
        local http_code
        http_code=$(curl -s $CURL_TLS_FLAG -o /dev/null -w '%{http_code}' -X POST \
          "${AAP_HOST}${AAP_PREFIX}/job_templates/${tmpl_id}/credentials/" \
          -H "Authorization: Bearer ${AAP_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"id\": ${cred_id}}")
        if [ "$http_code" = "204" ] || [ "$http_code" = "400" ]; then
          echo "Credential '${cred_name}' attached to template '${BASE_TMPL}' (HTTP ${http_code})"
        else
          echo "ERROR: failed to attach credential (HTTP ${http_code})" && exit 1
        fi
      else
        echo "WARNING: template '${BASE_TMPL}' not found, skipping credential attachment"
      fi
    }

    if [ "$MULTICLUSTER_ENABLED" = "true" ]; then
      PROXY_URL="${RHACM_CLUSTER_PROXY_URL}"
      HUB_TOKEN_VAL="${RHACM_HUB_TOKEN_VAL}"
      CRED_TYPE_NAME="{{ .Values.aapCredential.multicluster.credentialTypeName }}"
      MC_CRED_NAME="{{ .Values.aapCredential.multicluster.credentialName }}"

      [ -z "$PROXY_URL" ] && echo "ERROR: multicluster.clusterProxyUrl is required" && exit 1
      [ -z "$HUB_TOKEN_VAL" ] && echo "ERROR: multicluster.hubToken is required" && exit 1

      echo "Creating AAP Custom Credential Type '${CRED_TYPE_NAME}'"
      INPUT_CONFIG='{"fields": [{"id": "cluster_proxy_url", "type": "string", "label": "Cluster Proxy HUB URL"}, {"id": "hub_token", "type": "string", "label": "Cluster HUB Token", "secret": true}], "required": ["cluster_proxy_url", "hub_token"]}'
      INJECTOR_CONFIG='{"extra_vars": {"hub_url": "{{ "{{" }} cluster_proxy_url {{ "}}" }}", "token_acm": "{{ "{{" }} hub_token {{ "}}" }}"}}'

      CT_RESP=$(aap_get "/credential_types/?name=$(urlenc "${CRED_TYPE_NAME}")")
      CT_EXISTING=$(echo "$CT_RESP" | jq_count)

      CT_INPUTS="{\"inputs\": ${INPUT_CONFIG}, \"injectors\": ${INJECTOR_CONFIG}}"
      if [ "$CT_EXISTING" = "0" ]; then
        CT_ID=$(aap_post "/credential_types/" \
          "{\"name\": \"${CRED_TYPE_NAME}\", \"kind\": \"cloud\", \"inputs\": ${INPUT_CONFIG}, \"injectors\": ${INJECTOR_CONFIG}}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
        echo "Created credential type '${CRED_TYPE_NAME}' (id=${CT_ID})"
      else
        CT_ID=$(echo "$CT_RESP" | jq_first_id)
        aap_patch "/credential_types/${CT_ID}/" "$CT_INPUTS" | python3 -m json.tool
        echo "Updated credential type '${CRED_TYPE_NAME}' (id=${CT_ID})"
      fi

      MC_INPUTS="{\"cluster_proxy_url\": \"${PROXY_URL}\", \"hub_token\": \"${HUB_TOKEN_VAL}\"}"
      upsert_resource "/credentials/" "${MC_CRED_NAME}" \
        "{\"name\": \"${MC_CRED_NAME}\", \"credential_type\": ${CT_ID}, \"organization\": ${ORG_ID}, \"inputs\": ${MC_INPUTS}}"

      attach_credential_to_template "${MC_CRED_NAME}"

    else
      SA_NAMESPACE="{{ .Values.aapCredential.saNamespace | default .Release.Namespace }}"
      API_SERVER="{{ .Values.aapCredential.apiServer }}"
      CRED_NAME="{{ .Values.aapCredential.credentialName | default "hub-remediation" }}"
      SA_NAME=aap-remediation
      CRED_TYPE_K8S_BEARER=3
      MAX_RETRIES=10
      RETRY_DELAY=3

      echo "Waiting for token to be populated..."
      for _ in $(seq 1 "${MAX_RETRIES}"); do
        TOKEN=$(oc get secret "${SA_NAME}-token" -n "${SA_NAMESPACE}" \
          -o jsonpath='{.data.token}' 2>/dev/null || true)
        [ -n "$TOKEN" ] && break
        sleep "${RETRY_DELAY}"
      done
      [ -z "$TOKEN" ] && echo "ERROR: token not populated after waiting" && exit 1
      TOKEN=$(echo "$TOKEN" | base64 -d)

      INPUTS="{\"host\": \"${API_SERVER}\", \"bearer_token\": \"${TOKEN}\", \"verify_ssl\": false}"
      upsert_resource "/credentials/" "${CRED_NAME}" \
        "{\"name\": \"${CRED_NAME}\", \"credential_type\": ${CRED_TYPE_K8S_BEARER}, \"organization\": ${ORG_ID}, \"inputs\": ${INPUTS}}"

      attach_credential_to_template "${CRED_NAME}"
    fi

    GITEA_URL="http://gitea.{{ .Release.Namespace }}.svc:3000"
    PROJ_NAME="lightspeed-generated"
    PROJ_SCM_URL="${GITEA_URL}/{{ .Values.gitea.gitea.adminUser }}/generated-playbooks.git"

    upsert_resource "/projects/" "${PROJ_NAME}" \
      "{\"name\": \"${PROJ_NAME}\", \"organization\": ${ORG_ID}, \"scm_type\": \"git\", \"scm_url\": \"${PROJ_SCM_URL}\", \"scm_branch\": \"main\", \"scm_update_on_launch\": false}"

    echo "AAP credential setup complete"
{{- end }}
