{{- if .Values.mcpSecrets.openshift.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: noc-openshift-edge-kubeconfig
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  kubeconfig: {{ .Values.mcpSecrets.openshift.kubeconfig | b64enc | quote }}
{{- end }}
{{- if and .Values.mcpSecrets.aap.create (not .Values.mcpSecrets.aap.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: noc-aap-secret
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  AAP_TOKEN: {{ .Values.mcpSecrets.aap.token | default "" | b64enc | quote }}
{{- end }}
{{- if or .Values.mcpSecrets.gitea.create .Values.gitea.enabled .Values.aapMock.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "noc-gitea-secret" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: noc-gitea-secret
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  GITEA_TOKEN: {{ .Values.mcpSecrets.gitea.token | default "" | b64enc | quote }}
  {{- if .Values.gitea.gitea.adminPassword }}
  GITEA_ADMIN_PASSWORD: {{ .Values.gitea.gitea.adminPassword | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "GITEA_ADMIN_PASSWORD") }}
  GITEA_ADMIN_PASSWORD: {{ index $existing.data "GITEA_ADMIN_PASSWORD" }}
  {{- else }}
  GITEA_ADMIN_PASSWORD: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if .Values.mcpSecrets.servicenow.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: noc-servicenow-secret
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  SERVICENOW_USERNAME: {{ .Values.mcpSecrets.servicenow.username | b64enc | quote }}
  SERVICENOW_PASSWORD: {{ .Values.mcpSecrets.servicenow.password | b64enc | quote }}
{{- end }}
