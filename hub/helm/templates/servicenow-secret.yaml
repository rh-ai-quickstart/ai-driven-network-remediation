{{- $credentials := (include "hub.servicenow" . | fromJson).credentials }}
{{- if and $credentials.create (not $credentials.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.servicenowSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  SERVICENOW_USERNAME: {{ $credentials.username | toString | b64enc | quote }}
  SERVICENOW_PASSWORD: {{ $credentials.password | toString | b64enc | quote }}
  SERVICENOW_API_KEY: {{ $credentials.apiKey | b64enc | quote }}
{{- end }}
