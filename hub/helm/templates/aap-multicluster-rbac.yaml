{{- /*
  Hub-spoke multicluster only (silently skipped for other topologies): grant the
  AAP integration identity spoke API access through ACM cluster-proxy. Proxy auth
  arrives as User cluster:hub:system:serviceaccount:<ns>:<sa> (bind that User, not
  a spoke ServiceAccount subject). Mirrors the mcp-noc-openshift ClusterPermission
  in multi-cluster-creds-job.yaml (same pattern, broader resource scope).
*/}}
{{- if and (eq .Values.topology.deploymentMode "hub-spoke") (gt (len .Values.topology.spokes) 0) .Values.aapCredential.enabled .Values.aapCredential.multicluster.enabled }}
{{- $saNs := .Values.aapCredential.multicluster.hubServiceAccountNamespace }}
{{- $saName := .Values.aapCredential.multicluster.hubServiceAccountName }}
{{- range .Values.topology.spokes }}
---
apiVersion: rbac.open-cluster-management.io/v1alpha1
kind: ClusterPermission
metadata:
  # -edit suffix: ClusterRoleBinding roleRef is immutable, so switching from an older
  # inline-role binding requires a new resource name. helm then deletes the old
  # ClusterPermission and ACM recreates the spoke binding against `edit` cleanly.
  name: {{ include "hub.fullname" $ }}-aap-integration-edit
  namespace: {{ .name }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
spec:
  # Demo tradeoff: `edit` is broader than strictly needed (includes delete and
  # namespaced secrets). A production deployment should bind a custom ClusterRole
  # scoped to the workload kinds Lightspeed actually patches (deployments, HPAs, etc.)
  # with only get/list/watch/patch/create/update verbs.
  # We use `edit` here because Lightspeed generates patches/creates for arbitrary
  # workload kinds at runtime and `edit` covers them while excluding RBAC escalation,
  # cluster-scoped and quota writes. Avoids per-apiGroup 403 whack-a-mole.
  clusterRoleBinding:
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: edit
    subject:
      apiGroup: rbac.authorization.k8s.io
      kind: User
      name: cluster:hub:system:serviceaccount:{{ $saNs }}:{{ $saName }}
{{- end }}
{{- end }}
