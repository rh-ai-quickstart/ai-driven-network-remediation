apiVersion: v2
name: hub
description: Helm chart for the hub component
type: application
version: 0.0.1
appVersion: 0.0.1

dependencies:
  # Remote charts
  - name: pgvector
    version: 0.5.5
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
  - name: llama-stack
    version: 0.8.7
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
  # Use-case subcharts
  - name: telco
    version: 0.0.1
    repository: "file://charts/telco"
    condition: telco.enabled
  - name: network
    version: 0.0.1
    repository: "file://charts/network"
    condition: network.enabled
  # Local infrastructure subcharts
  - name: kafka
    version: 0.1.0
    repository: "file://charts/kafka"
    condition: kafka.enabled
  - name: minio
    version: 0.5.5
    repository: "file://charts/minio"
    condition: minio.enabled
  - name: gitea
    version: 0.1.0
    repository: "file://charts/gitea"
    condition: gitea.enabled
