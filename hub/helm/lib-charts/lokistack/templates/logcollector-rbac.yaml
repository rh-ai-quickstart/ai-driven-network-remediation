{{- if .Values.clusterLogForwarder.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lokistack.collectorServiceAccount" . }}
  namespace: {{ .Values.clusterLogForwarder.namespace }}
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "log-collector") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lokistack.collectorServiceAccount" . }}-application
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "log-collector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: {{ include "lokistack.collectorServiceAccount" . }}
    namespace: {{ .Values.clusterLogForwarder.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lokistack.collectorServiceAccount" . }}-infrastructure
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "log-collector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-infrastructure-logs
subjects:
  - kind: ServiceAccount
    name: {{ include "lokistack.collectorServiceAccount" . }}
    namespace: {{ .Values.clusterLogForwarder.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lokistack.collectorServiceAccount" . }}-logs-writer
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "log-collector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "lokistack.collectorServiceAccount" . }}
    namespace: {{ .Values.clusterLogForwarder.namespace }}
{{- end }}
