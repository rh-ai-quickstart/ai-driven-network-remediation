---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-create
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-bucket-create
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-storage
          image: {{ .Values.minio.bucketJobImage.repository }}:{{ .Values.minio.bucketJobImage.tag }}
          imagePullPolicy: {{ .Values.minio.bucketJobImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until aws s3 ls --endpoint-url {{ .Values.minio.endpoint }} >/dev/null 2>&1; do
                echo "Waiting for object storage to be ready..."
                sleep 5
              done
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret.name }}
                  key: {{ .Values.minio.existingSecret.userKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret.name }}
                  key: {{ .Values.minio.existingSecret.passwordKey }}
            - name: AWS_DEFAULT_REGION
              value: us-east-1
      containers:
        - name: create-bucket
          image: {{ .Values.minio.bucketJobImage.repository }}:{{ .Values.minio.bucketJobImage.tag }}
          imagePullPolicy: {{ .Values.minio.bucketJobImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if ! aws s3api head-bucket --bucket "{{ .Values.minio.bucketName }}" --endpoint-url {{ .Values.minio.endpoint }}; then
                aws s3api create-bucket --bucket "{{ .Values.minio.bucketName }}" --endpoint-url {{ .Values.minio.endpoint }}
              fi
              echo "Bucket '{{ .Values.minio.bucketName }}' is ready"
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret.name }}
                  key: {{ .Values.minio.existingSecret.userKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret.name }}
                  key: {{ .Values.minio.existingSecret.passwordKey }}
            - name: AWS_DEFAULT_REGION
              value: us-east-1
