# https://kubernetes.io/docs/concepts/containers/images/
image:
  registry: quay.io/rh-ai-quickstart
  chatbotService: hub-chatbot-service
  ingestionPipeline: hub-ingestion-pipeline
  agentService: hub-agent-service
  ranAnomalyDetector: hub-ran-anomaly-detector
  ranRcaService: hub-ran-rca-service
  ranChatbotService: hub-ran-chatbot-service
  frontend: noc-frontend
  pullPolicy: Always
  tag: "0.0.1"

global:
  routes:
    enabled: true

# ══════════════════════════════════════════════════════════════════════
# Multi-cluster topology (CLUSTER_COUNT)
# ══════════════════════════════════════════════════════════════════════
# clusterCount=1 → single-cluster (spokes empty).
# clusterCount=N (N>=2) → hub-spoke with N spokes; spokes populated from
# hub/helm/spokes.generated.yaml (gitignored, produced by make render-spokes).
topology:
  clusterCount: 1
  deploymentMode: single-cluster  # or hub-spoke
  spokeCount: 0
  edgeNamespace: dark-noc-edge
  spokeNamePrefix: edge-site
  spokes: []

# ══════════════════════════════════════════════════════════════════════
# Remote subcharts
# ══════════════════════════════════════════════════════════════════════

pgvector:
  secret:
    user: postgres
    password: rag_password
    dbname: rag_blueprint
    host: pgvector
    port: "5432"

llama-stack:
  host: llamastack-service
  port: "8321"
  replicaCount: 1
  managedByOperator: true
  network:
    exposeRoute: false
  volumes:
    - configMap:
        defaultMode: 420
        name: run-config
      name: run-config-volume
    - name: dot-llama
      persistentVolumeClaim:
        claimName: llama-stack-data
    - emptyDir: {}
      name: cache
  volumeMounts:
    - mountPath: /app-config
      name: run-config-volume
    - mountPath: /.cache
      name: cache
  initContainers:
    enabled: true
  # Operator default is 1 CPU / 1Gi when omitted. That often fails to schedule on
  # ACM hubs where workers are already near full on requests. Keep this modest
  # so helm --wait can succeed; raise if you have spare capacity.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  pgvector:
    enabled: true
  mcp-servers:
    noc-openshift:
      uri: http://mcp-noc-openshift:8000/mcp
    noc-kafka:
      uri: http://mcp-noc-kafka:8000/mcp
    noc-aap:
      uri: http://mcp-noc-aap:8000/mcp
    noc-servicenow:
      uri: http://mcp-noc-servicenow:8000/mcp
  models:
    adnr-llm:
      id: ""
      enabled: false
      url: ""
      apiToken: ""
      maxTokens: 4096

# ══════════════════════════════════════════════════════════════════════
# Local infrastructure subcharts
# ══════════════════════════════════════════════════════════════════════

# ── Kafka (subchart: charts/kafka) ────────────────────────────────
# Defaults live in charts/kafka/values.yaml; only overrides are listed here.
kafka:
  enabled: true
  kafkaUI:
    enabled: false

# ── MinIO (subchart: charts/minio) ────────────────────────────────
# Defaults live in charts/minio/values.yaml; only overrides and parent references here.
minio:
  enabled: true
  route:
    enabled: true
  # Parent chart references (used by hub templates for ingestion-pipeline)
  host: minio
  port: "9000"
  secretName: minio

# ── LokiStack (subchart: charts/lokistack) ────────────────────────
lokistack:
  enabled: false
  name: logging-loki
  namespace: ""
  clusterDomain: ""
  minio:
    endpoint: "http://minio:9000"
    bucketName: loki
    existingSecret:
      name: minio
      userKey: user
      passwordKey: password
    bucketJobImage:
      repository: quay.io/minio/minio
      tag: latest
      pullPolicy: IfNotPresent
  lokistack:
    name: logging-loki
    size: 1x.extra-small
    replication:
      factor: 1
    template:
      distributor:
        replicas: 1
      gateway:
        replicas: 1
      indexGateway:
        replicas: 1
      ingester:
        replicas: 1
      querier:
        replicas: 1
      queryFrontend:
        replicas: 1
    storage:
      secret:
        name: minio
        type: s3
      schemas:
        - version: v13
          effectiveDate: "2024-01-01"
      storageClassName: gp3-csi
    tenants:
      mode: openshift-logging
    limits:
      global:
        ingestion:
          ingestionRate: 50
          ingestionBurstSize: 50
        queries:
          queryTimeout: 3m
          maxVolumeSeries: 1000
  grafana:
    enabled: true
    replicas: 1
    image:
      repository: grafana/grafana
      tag: latest
      pullPolicy: IfNotPresent
    adminUser: admin
    adminPassword: admin
    auth:
      anonymous:
        enabled: false
        orgRole: Viewer
    datasources:
      loki:
        application:
          enabled: true
          name: Loki-Application
          isDefault: true
          tlsSkipVerify: true
        infrastructure:
          enabled: true
          name: Loki-Infrastructure
          isDefault: false
          tlsSkipVerify: true
        audit:
          enabled: false
          name: Loki-Audit
          isDefault: false
          tlsSkipVerify: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      type: ClusterIP
      port: 3000
      annotations:
        service.alpha.openshift.io/serving-cert-secret-name: grafana-tls
    route:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    rbac:
      serviceAccount:
        name: grafana
      lokiReader:
        serviceAccountName: grafana-loki-reader
  mcpLokistack:
    enabled: true
    rbac:
      serviceAccountName: mcp-lokistack-reader
  clusterLogForwarder:
    enabled: true
    name: instance
    namespace: openshift-logging
    serviceAccountName: logcollector
    tls:
      insecureSkipVerify: true
    pipelines:
      application: true
      infrastructure: true
      audit: false
  testLogGenerator:
    enabled: false
    replicas: 1
    image:
      repository: curlimages/curl
      tag: latest
    interval: 5

# ══════════════════════════════════════════════════════════════════════
# Mock services (deployed as Helm templates in hub/helm/templates/)
# ══════════════════════════════════════════════════════════════════════

aapMock:
  enabled: true
  image:
    repository: quay.io/rh-ai-quickstart/noc-aap-mock
    tag: "0.1.0"

gitea:
  enabled: true
  gitea:
    external: false
    adminUser: "noc"
    adminPassword: ""
    adminEmail: "noc@local"

servicenowMock:
  enabled: true
  image:
    repository: quay.io/rh-ai-quickstart/noc-servicenow-mock
    tag: "0.1.0"

# ══════════════════════════════════════════════════════════════════════
# Edge RBAC hook (pre-install Job) — single-cluster only
# ══════════════════════════════════════════════════════════════════════
# Enabled via Makefile when ROUTES_ENABLED=true and CLUSTER_COUNT=1.
# Forced off when topology.deploymentMode=hub-spoke (real spokes use
# multi-cluster-creds-job + per-spoke kubeconfig secrets instead).

edgeRbac:
  enabled: false
  # Overridden at deploy time via: --set-string edgeRbac.edgeNamespace='$(EDGE_NAMESPACE)'
  edgeNamespace: "hub"
  edgeApiServer: "https://kubernetes.default.svc"
  image: "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest"

# ══════════════════════════════════════════════════════════════════════
# Multi-cluster MCP kubeconfig Job (hub-spoke only)
# ══════════════════════════════════════════════════════════════════════
# When topology.deploymentMode=hub-spoke, a pre-install Job builds one
# kubeconfig secret per spoke (noc-openshift-kubeconfig-<spoke-name>)
# via ACM cluster-proxy (Hive admin-kubeconfig fallback).
# Proxy kubeconfigs use tokenFile (MCP pod SA); C7 must wait for ManagedClusters
# before helm-install. Per-spoke ClusterPermission grants hub MCP SA spoke API
# access through the proxy. TLS skip defaults on for lab; pin CA via insecureSkipTlsVerify.

multiClusterCreds:
  image: "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest"
  serviceAccountName: mcp-noc-openshift
  # Lab default: skip TLS verify against cluster-proxy. Set false and pin CA for non-lab.
  insecureSkipTlsVerify: true

# ══════════════════════════════════════════════════════════════════════
# AAP Credential hook (post-install Job)
# Creates a k8s SA with remediation RBAC and registers the resulting
# token as an AAP credential (type=3) for playbook execution.
# ══════════════════════════════════════════════════════════════════════

aapCredential:
  enabled: false
  apiServer: "https://kubernetes.default.svc"
  saNamespace: ""
  credentialName: "hub-remediation"
  organizationId: 1
  # RHACM multicluster: route cluster access through ACM hub proxy.
  # Creates an AAP Custom Credential Type + credential instead of a per-cluster SA.
  # Prerequisites (user-managed): RHACM 2.9+, ManagedServiceAccount addon,
  # hub ServiceAccount with multicluster RBAC, cluster-proxy route.
  multicluster:
    enabled: false
    clusterProxyUrl: ""
    hubToken: ""
    credentialTypeName: "RHACM Cluster Proxy"
    credentialName: "rhacm-hub"

# ══════════════════════════════════════════════════════════════════════
# Hub application services
# ══════════════════════════════════════════════════════════════════════

ingestionPipeline:
  replicaCount: 1
  autoIngestOnStartup: "true"
  waitForDeps: true
  vectorStoreName: noc_runbooks
  telcoVectorStoreName: telco_oran_docs
  llamastackHost: llamastack-service
  embeddingModel: sentence-transformers/nomic-ai/nomic-embed-text-v1.5
  chunkSizeTokens: 800
  chunkOverlapTokens: 80
  minio:
    bucket: runbooks
    secure: false
    runbookPrefix: runbooks/
    telcoDocsPrefix: telco-docs/
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

chatbotService:
  prompts:
    chatSystem: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    mcpOpenshiftUrl: "http://mcp-noc-openshift:8000"
    mcpLokistackUrl: "http://mcp-noc-lokistack:8000"
    mcpKafkaUrl: "http://mcp-noc-kafka:8000"
    mcpAapUrl: "http://mcp-noc-aap:8000"
    mcpServicenowUrl: "http://mcp-noc-servicenow:8000"
    servicenowUrl: "http://servicenow-mock:8080"
    kafkaBootstrap: "kafka:9092"
    modelApiUrl: "http://llamastack-service:8321/v1/completions"
    modelName: "granite-4-h-tiny"
    demoTopic: "system-alerts"
    auditTopic: "incident-audit"
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

frontend:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources: {}
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

agentService:
  prompts:
    analyzeSystem: ""
    investigateSystem: ""
  replicaCount: 1
  granite:
    # make helm-install overrides this to adnr-llm/<ADNR_LLM_ID> when LLM env is set.
    modelName: "granite-4.0-8b"
  lightspeed:
    url: ""
    token: ""
    tokenSecretName: ""
    tokenSecretKey: "api_key"
    verifySSL: "false"
    namespace: "aap"
    baseTemplateName: "lightspeed-runner"
  slack:
    enabled: "false"
    botToken: ""
    existingSecret: ""
    channel: "#ai-driven-network"
  servicenowInstanceUrl: ""
  servicenowCreateResolved: "false"
  env:
    kafkaBootstrap: "kafka:9092"
    kafkaGroupId: "dark-noc-agent"
    kafkaAuditTopic: "incident-audit"
    kafkaConsumerEnabled: "true"
  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 10

# ══════════════════════════════════════════════════════════════════════
# RAN Anomaly Detector (Telco/O-RAN) — independent, rule-based workflow.
# Can be disabled (ranAnomalyDetector.enabled: false) for deployments that
# don't need the Telco/O-RAN use case.
# ══════════════════════════════════════════════════════════════════════

ranAnomalyDetector:
  # Off by default until the image is published for the selected VERSION.
  # Enable via ENABLE_RAN_ANOMALY=true (make) or --set ranAnomalyDetector.enabled=true.
  enabled: false
  replicaCount: 1
  env:
    kafkaBootstrap: "kafka:9092"
    kafkaMetricsTopic: "ran-combined-metrics"
    kafkaGroupId: "ran-anomaly-detector"
    kafkaConsumerEnabled: "true"
    kafkaAnomaliesTopic: "ran-anomalies"
    kafkaProducerEnabled: "true"
    historyWindowSize: "10"
    recentAnomaliesLimit: "100"
  service:
    type: ClusterIP
    port: 8002
    targetPort: 8002
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8002
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8002
    initialDelaySeconds: 10
    periodSeconds: 10

# ══════════════════════════════════════════════════════════════════════
# RAN RCA Service (Telco/O-RAN) — LLM-based root cause analysis.
# Consumes anomalies from ran-anomaly-detector, enriches them via
# LangGraph (RAG + Granite LLM), publishes to ran-anomalies-enriched.
# ══════════════════════════════════════════════════════════════════════

ranRcaService:
  enabled: true
  replicaCount: 1
  env:
    llamastackHost: "llamastack-service"
    llamastackPort: "8321"
    vectorStoreName: "telco_oran_docs"
    graniteModelName: "ibm-granite/granite-3.3-8b-instruct"
    kafkaBootstrap: "kafka:9092"
    kafkaAnomaliesTopic: "ran-anomalies"
    kafkaEnrichedTopic: "ran-anomalies-enriched"
    kafkaGroupId: "ran-rca-service"
    kafkaConsumerEnabled: "true"
    recentAnomaliesLimit: "100"
  service:
    type: ClusterIP
    port: 8003
    targetPort: 8003
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8003
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8003
    initialDelaySeconds: 10
    periodSeconds: 10

# ══════════════════════════════════════════════════════════════════════
# RAN Chatbot Entrypoint (Telco/O-RAN) — thin conversational BFF over
# detected RAN anomalies and their root cause analysis. Independent from
# ranAnomalyDetector, ranRcaService, and chatbotService (the network
# remediation NOC chatbot). Can be disabled (ranChatbotService.enabled:
# false) for deployments that don't need the Telco/O-RAN use case.
# ══════════════════════════════════════════════════════════════════════

ranChatbotService:
  enabled: true
  replicaCount: 1
  env:
    kafkaBootstrap: "kafka:9092"
    enrichedAnomaliesTopic: "ran-anomalies-enriched"
    modelApiUrl: "http://llamastack-service:8321/v1/completions"
    modelName: "granite-4-h-tiny"
    corsOrigins: "http://localhost:3000"
  service:
    type: ClusterIP
    port: 8003
    targetPort: 8003
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8003
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8003
    initialDelaySeconds: 10
    periodSeconds: 10

# ══════════════════════════════════════════════════════════════════════
# MCP Secrets
# ══════════════════════════════════════════════════════════════════════

mcpSecrets:
  openshift:
    # On OpenShift: keep false — the edge-rbac hook creates this secret dynamically.
    # On Kind/CI: set true and provide kubeconfig via --set-file mcpSecrets.openshift.kubeconfig=<path>
    create: false
    kubeconfig: ""
  aap:
    create: true
    token: ""
  gitea:
    create: false
    token: ""
  servicenow:
    create: true
    username: ""
    password: ""

# ══════════════════════════════════════════════════════════════════════
# MCP Servers (subchart: mcp-servers from ai-architecture-charts)
# ══════════════════════════════════════════════════════════════════════

mcp-servers:
  enabled: true
  mcp-servers:
    noc-openshift:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/noc-mcp-openshift
        tag: "0.1.0"
      port: 8000
      targetPort: 8000
      transport: streamable-http
      imagePullPolicy: Always
      env:
        MCP_TRANSPORT: "streamable-http"
        MCP_PORT: "8000"
        DEFAULT_NAMESPACE: "dark-noc-edge"
        EDGE_KUBECONFIG: "/kubeconfig/kubeconfig"
      volumes:
        - name: edge-kubeconfig
          secret:
            secretName: noc-openshift-edge-kubeconfig
      volumeMounts:
        - name: edge-kubeconfig
          mountPath: /kubeconfig
          readOnly: true

    noc-lokistack:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/noc-mcp-lokistack
        tag: "0.1.0"
      port: 8000
      targetPort: 8000
      transport: streamable-http
      imagePullPolicy: Always
      env:
        MCP_TRANSPORT: "streamable-http"
        MCP_PORT: "8000"
        LOKI_TLS_VERIFY: "false"
        LOKI_DEFAULT_TENANT: "application"
        LOKI_MAX_LINES: "100"
        LOKI_MAX_LINES_CEILING: "500"
        LOKI_MAX_DURATION: "24h"
        LOKI_QUERY_TIMEOUT: "30"
        LOKI_RETRY_ATTEMPTS: "3"
        LOKI_CA_CERT_PATH: ""
      envSecrets:
        LOKI_URL:
          name: lokistack-config
          key: LOKI_URL
        LOKI_TOKEN:
          name: mcp-lokistack-token
          key: token

    noc-kafka:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/noc-mcp-kafka
        tag: "0.1.0"
      port: 8000
      targetPort: 8000
      transport: streamable-http
      imagePullPolicy: Always
      env:
        MCP_TRANSPORT: "streamable-http"
        MCP_PORT: "8000"
        KAFKA_CONSUME_TOPICS: "system-alerts,noc-alerts,remediation-jobs"
        KAFKA_PRODUCE_TOPICS: "remediation-jobs,agent-events,incident-audit"
        KAFKA_BOOTSTRAP: "kafka:9092"

    noc-aap:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/noc-mcp-aap
        tag: "0.1.0"
      port: 8000
      targetPort: 8000
      transport: streamable-http
      imagePullPolicy: Always
      env:
        MCP_TRANSPORT: "streamable-http"
        MCP_PORT: "8000"
        # AAP uses edge TLS termination on OpenShift; internal services
        # serve plain HTTP on port 80. To restore HTTPS here, mount AAP's
        # CA cert (bundle_cacert_secret from the AAP CR) and set
        # REQUESTS_CA_BUNDLE to the mount path.
        AAP_URL: "http://aap.aap.svc"
        AAP_API_PREFIX: "/api/controller/v2"
        AAP_VERIFY_SSL: "false"
        AAP_CA_BUNDLE: ""
        GITEA_URL: "http://gitea:3000"
        GITEA_OWNER: "noc"
        GITEA_REPO: "generated-playbooks"
      envSecrets:
        AAP_TOKEN:
          name: noc-aap-secret
          key: AAP_TOKEN
      secretMounts:
        mountPath: /secrets
        secrets:
          - noc-gitea-secret

    noc-servicenow:
      enabled: true
      deploymentMode: deployment
      image:
        repository: quay.io/rh-ai-quickstart/noc-mcp-servicenow
        tag: "0.1.0"
      port: 8000
      targetPort: 8000
      transport: streamable-http
      imagePullPolicy: Always
      env:
        MCP_TRANSPORT: "streamable-http"
        MCP_PORT: "8000"
        SERVICENOW_URL: "http://servicenow-mock.hub.svc:8080"
      envSecrets:
        SERVICENOW_USERNAME:
          name: noc-servicenow-secret
          key: SERVICENOW_USERNAME
        SERVICENOW_PASSWORD:
          name: noc-servicenow-secret
          key: SERVICENOW_PASSWORD

    # Disable default servers from the shared chart
    weather:
      enabled: false
    oracle-sqlcl:
      enabled: false
    github-mcp:
      enabled: false
    openshift-mcp:
      enabled: false

