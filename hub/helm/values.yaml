# https://kubernetes.io/docs/concepts/containers/images/
image:
  registry: quay.io/rh-ai-quickstart
  ingestionPipeline: hub-ingestion-pipeline
  pullPolicy: Always
  tag: "0.0.1"

waitImage: "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest"

global:
  routes:
    enabled: true
  # Gates an OpenShift oauth-proxy sidecar in front of hub-frontend and
  # hub-ran-frontend so their Routes require an authenticated OpenShift login
  # before reaching the SPA or its /api/* proxy (see hub/frontend/FRONTEND.md
  # and hub/ran-frontend/README.md "Access control"). Off by default so the
  # "click a demo button, no login needed" experience documented in
  # docs/RAN-DEMO-SCRIPT.md and docs/LIGHTSPEED-DEMO-SCRIPT.md keeps working
  # out of the box; turn on for shared/persistent clusters.
  #
  # NOTE: leaving these Routes able to skip authentication at all is a
  # QuickStart/demo convenience, not something a released product should ship.
  # Before this repo becomes more than a QuickStart (e.g. any packaged/GA
  # release), remove the ability to disable this gate entirely -- it should be
  # mandatory-on, not an opt-in toggle defaulting to off.
  frontendAuth:
    enabled: false
    # Deliberately left on :latest rather than pinned, unlike this chart's other
    # images: quay.io/openshift/origin-oauth-proxy tags track OpenShift cluster
    # minor versions (4.17, 4.18, ...), and upstream guidance is to match your
    # own cluster's version. Pinning one specific tag here would silently be
    # wrong for anyone running this QuickStart against a different OCP version
    # than whichever we hardcoded. Override with --set global.frontendAuth.image=...
    # if you want to pin to a tag matching a specific cluster.
    image: "quay.io/openshift/origin-oauth-proxy:latest"

# ══════════════════════════════════════════════════════════════════════
# Remote subcharts
# ══════════════════════════════════════════════════════════════════════

pgvector:
  secret:
    user: postgres
    password: rag_password
    dbname: rag_blueprint
    host: pgvector
    port: "5432"

llama-stack:
  host: llamastack-service
  port: "8321"
  replicaCount: 1
  managedByOperator: true
  network:
    exposeRoute: false
  volumes:
    - configMap:
        defaultMode: 420
        name: run-config
      name: run-config-volume
    - name: dot-llama
      persistentVolumeClaim:
        claimName: llama-stack-data
    - emptyDir: {}
      name: cache
  volumeMounts:
    - mountPath: /app-config
      name: run-config-volume
    - mountPath: /.cache
      name: cache
  initContainers:
    enabled: true
  # Operator default is 1 CPU / 1Gi when omitted. That often fails to schedule on
  # ACM hubs where workers are already near full on requests. Keep this modest
  # so helm --wait can succeed; raise if you have spare capacity.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  pgvector:
    enabled: true
  mcp-servers: {}
  models:
    adnr-llm:
      id: ""
      enabled: false
      url: ""
      apiToken: ""
      maxTokens: 4096

# ══════════════════════════════════════════════════════════════════════
# Local infrastructure subcharts
# ══════════════════════════════════════════════════════════════════════

# ── Kafka (subchart: charts/kafka) ────────────────────────────────
# Defaults live in charts/kafka/values.yaml; only overrides are listed here.
kafka:
  enabled: true
  kafkaUI:
    enabled: false

# ── MinIO (subchart: charts/minio) ────────────────────────────────
# Defaults live in charts/minio/values.yaml; only overrides and parent references here.
minio:
  enabled: true
  route:
    enabled: true
  # Parent chart references (used by hub templates for ingestion-pipeline)
  host: minio
  port: "9000"
  secretName: minio

gitea:
  enabled: true
  gitea:
    external: false
    adminUser: "noc"
    adminPassword: ""
    adminEmail: "noc@local"

# ══════════════════════════════════════════════════════════════════════
# Hub application services
# ══════════════════════════════════════════════════════════════════════

ingestionPipeline:
  replicaCount: 1
  autoIngestOnStartup: "true"
  waitForDeps: true
  vectorStoreName: noc_runbooks
  telcoVectorStoreName: telco_oran_docs
  llamastackHost: llamastack-service
  embeddingModel: sentence-transformers/nomic-ai/nomic-embed-text-v1.5
  chunkSizeTokens: 800
  chunkOverlapTokens: 80
  minio:
    bucket: runbooks
    secure: false
    runbookPrefix: runbooks/
    telcoDocsPrefix: telco-docs/
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# ══════════════════════════════════════════════════════════════════════
# Use-case subcharts
# ══════════════════════════════════════════════════════════════════════

telco:
  enabled: true
  fullnameOverride: hub
  nameOverride: hub

network:
  enabled: true
  fullnameOverride: hub
  nameOverride: hub
  topology:
    clusterCount: 1
    deploymentMode: single-cluster
    spokeCount: 0
    edgeNamespace: dark-noc-edge
    spokeNamePrefix: edge-site
    spokes: []
  llamastack:
    host: llamastack-service
    port: "8321"
  gitea:
    enabled: true
    adminUser: "noc"
    adminPassword: ""
