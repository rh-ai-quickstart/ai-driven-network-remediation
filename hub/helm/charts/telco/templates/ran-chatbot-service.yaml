{{- if .Values.ranChatbotService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telco.fullname" . }}-ran-chatbot-service
  labels:
    {{- include "telco.labels" . | nindent 4 }}
    app.kubernetes.io/component: ran-chatbot-service
spec:
  replicas: {{ .Values.ranChatbotService.replicaCount }}
  selector:
    matchLabels:
      {{- include "telco.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ran-chatbot-service
  template:
    metadata:
      labels:
        {{- include "telco.labels" . | nindent 8 }}
        app.kubernetes.io/component: ran-chatbot-service
    spec:
      containers:
        - name: ran-chatbot-service
          image: "{{ .Values.image.registry }}/{{ .Values.image.ranChatbotService }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.ranChatbotService.env.kafkaBootstrap | quote }}
            - name: ENRICHED_ANOMALIES_TOPIC
              value: {{ .Values.ranChatbotService.env.enrichedAnomaliesTopic | quote }}
            - name: DEMO_METRICS_TOPIC
              value: {{ .Values.ranChatbotService.env.demoMetricsTopic | quote }}
            - name: MODEL_API_URL
              value: {{ .Values.ranChatbotService.env.modelApiUrl | quote }}
            - name: MODEL_NAME
              value: {{ .Values.ranChatbotService.env.modelName | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.ranChatbotService.env.corsOrigins | quote }}
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.ranChatbotService.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.ranChatbotService.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ranChatbotService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telco.fullname" . }}-ran-chatbot-service
  labels:
    {{- include "telco.labels" . | nindent 4 }}
    app.kubernetes.io/component: ran-chatbot-service
spec:
  type: {{ .Values.ranChatbotService.service.type }}
  ports:
    - port: {{ .Values.ranChatbotService.service.port }}
      targetPort: {{ .Values.ranChatbotService.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "telco.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ran-chatbot-service
{{- end }}
