{{- if and .Values.global.frontendAuth.enabled .Values.ranFrontend.enabled }}
{{- $ranFrontendName := printf "%s-ran-frontend" (include "telco.fullname" .) }}
{{- $existingRanFrontend := lookup "v1" "Secret" .Release.Namespace (printf "%s-oauth" $ranFrontendName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ranFrontendName }}-oauth
  labels:
    {{- include "telco.labels" . | nindent 4 }}
    app.kubernetes.io/component: ran-frontend
type: Opaque
data:
  {{- if and $existingRanFrontend $existingRanFrontend.data (index $existingRanFrontend.data "cookie-secret") }}
  cookie-secret: {{ index $existingRanFrontend.data "cookie-secret" }}
  {{- else }}
  cookie-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
