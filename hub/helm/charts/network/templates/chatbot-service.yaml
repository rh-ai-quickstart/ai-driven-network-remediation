{{- if .Values.chatbotService.enabled }}
{{- $defaultCpuDemoSiteA := .Values.chatbotService.env.edgeSiteId -}}
{{- if and (eq .Values.topology.deploymentMode "hub-spoke") (gt (len .Values.topology.spokes) 0) -}}
{{- $defaultCpuDemoSiteA = index (index .Values.topology.spokes 0) "siteId" -}}
{{- end -}}
{{- $cpuDemoSiteA := .Values.chatbotService.env.cpuDemoSiteA | default $defaultCpuDemoSiteA -}}
{{- $defaultCpuDemoSiteB := $cpuDemoSiteA -}}
{{- if and (eq .Values.topology.deploymentMode "hub-spoke") (gt (len .Values.topology.spokes) 1) -}}
{{- $defaultCpuDemoSiteB = index (index .Values.topology.spokes 1) "siteId" -}}
{{- end -}}
{{- $cpuDemoSiteB := .Values.chatbotService.env.cpuDemoSiteB | default $defaultCpuDemoSiteB -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network.fullname" . }}-chatbot-service
  labels:
    {{- include "network.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot-service
spec:
  replicas: {{ .Values.chatbotService.replicaCount }}
  selector:
    matchLabels:
      {{- include "network.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chatbot-service
  template:
    metadata:
      labels:
        {{- include "network.labels" . | nindent 8 }}
        app.kubernetes.io/component: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: "{{ .Values.image.registry }}/{{ .Values.image.chatbotService }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_OPENSHIFT_URL
              value: {{ .Values.chatbotService.env.mcpOpenshiftUrl | quote }}
            - name: MCP_LOKISTACK_URL
              value: {{ .Values.chatbotService.env.mcpLokistackUrl | quote }}
            - name: MCP_KAFKA_URL
              value: {{ .Values.chatbotService.env.mcpKafkaUrl | quote }}
            - name: MCP_AAP_URL
              value: {{ .Values.chatbotService.env.mcpAapUrl | quote }}
            - name: MCP_SERVICENOW_URL
              value: {{ .Values.chatbotService.env.mcpServicenowUrl | quote }}
            - name: SERVICENOW_URL
              value: {{ .Values.chatbotService.env.servicenowUrl | quote }}
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.chatbotService.env.kafkaBootstrap | quote }}
            - name: MODEL_API_URL
              value: {{ .Values.chatbotService.env.modelApiUrl | quote }}
            - name: MODEL_NAME
              value: {{ .Values.chatbotService.env.modelName | quote }}
            - name: EDGE_NAMESPACE
              value: {{ .Values.topology.edgeNamespace | quote }}
            - name: EDGE_SITE_ID
              value: {{ .Values.chatbotService.env.edgeSiteId | quote }}
            - name: DEMO_WORKLOAD
              value: {{ .Values.chatbotService.env.demoWorkload | quote }}
            - name: CPU_DEMO_SITE_A
              value: {{ $cpuDemoSiteA | quote }}
            - name: CPU_DEMO_SITE_B
              value: {{ $cpuDemoSiteB | quote }}
            - name: DEMO_TOPIC
              value: {{ .Values.chatbotService.env.demoTopic | quote }}
            - name: AUDIT_TOPIC
              value: {{ .Values.chatbotService.env.auditTopic | quote }}
            {{- if .Values.chatbotService.prompts.chatSystem }}
            - name: CHAT_SYSTEM_PROMPT
              value: {{ .Values.chatbotService.prompts.chatSystem | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.chatbotService.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.chatbotService.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.chatbotService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "network.fullname" . }}-chatbot-service
  labels:
    {{- include "network.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot-service
spec:
  type: {{ .Values.chatbotService.service.type }}
  ports:
    - port: {{ .Values.chatbotService.service.port }}
      targetPort: {{ .Values.chatbotService.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "network.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot-service
{{- end }}
