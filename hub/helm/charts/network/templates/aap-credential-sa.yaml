{{- if .Values.aapCredential.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "network.fullname" . }}-aap-credential
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "network.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "network.fullname" . }}-aap-credential-{{ .Release.Namespace }}
  labels:
    {{- include "network.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "network.fullname" . }}-aap-credential-{{ .Release.Namespace }}
  labels:
    {{- include "network.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "network.fullname" . }}-aap-credential-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "network.fullname" . }}-aap-credential
    namespace: {{ .Release.Namespace }}
{{- end }}
