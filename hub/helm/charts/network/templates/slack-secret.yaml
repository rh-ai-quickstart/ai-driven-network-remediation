{{- $slack := .Values.agentService.slack }}
{{- $legacySecretName := "noc-slack-secret" }}
{{- $data := dict }}
{{- if and $slack.botToken (not $slack.existingSecret) }}
{{- $data = dict "SLACK_BOT_TOKEN" ($slack.botToken | b64enc) }}
{{- else if and .Release.IsUpgrade (eq $slack.existingSecret $legacySecretName) }}
{{/* Keep a selected legacy Secret in the manifest if this release owns it, so Helm does not prune it. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $legacySecretName }}
{{- $owner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing }}
{{- $ownerNamespace := dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existing }}
{{- $manager := dig "metadata" "labels" "app.kubernetes.io/managed-by" "" $existing }}
{{- if and (eq $owner .Release.Name) (eq $ownerNamespace .Release.Namespace) (eq $manager .Release.Service) }}
{{- $data = $existing.data }}
{{- end }}
{{- end }}
{{- with $data }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $legacySecretName }}
  labels:
    {{- include "network.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
