{{- if .Values.aapCredential.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network.fullname" . }}-aap-credential-script
  labels:
    {{- include "network.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
data:
  setup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    CURL_TLS_FLAG=""
    if [ "${AAP_VERIFY_SSL}" != "true" ]; then
      CURL_TLS_FLAG="-k"
    fi

    AAP_HOST="{{ include "network.aapUrl" . }}"
    AAP_PREFIX="{{ index .Values "mcp-servers" "mcp-servers" "noc-aap" "env" "AAP_API_PREFIX" }}"
    ORG_ID="{{ .Values.aapCredential.organizationId }}"
    MULTICLUSTER_ENABLED="{{ .Values.aapCredential.multicluster.enabled }}"
    BASE_TMPL="{{ .Values.agentService.lightspeed.baseTemplateName }}"
    REMEDIATION_TMPLS="{{ join " " .Values.aapCredential.remediationTemplateNames }}"

    aap_get()  { curl -fs $CURL_TLS_FLAG "${AAP_HOST}${AAP_PREFIX}$1" -H "Authorization: Bearer ${AAP_TOKEN}"; }
    aap_post() { curl -fs $CURL_TLS_FLAG -X POST "${AAP_HOST}${AAP_PREFIX}$1" -H "Authorization: Bearer ${AAP_TOKEN}" -H "Content-Type: application/json" -d "$2"; }
    aap_patch(){ curl -fs $CURL_TLS_FLAG -X PATCH "${AAP_HOST}${AAP_PREFIX}$1" -H "Authorization: Bearer ${AAP_TOKEN}" -H "Content-Type: application/json" -d "$2"; }
    jq_count() { python3 -c "import sys,json; print(len(json.load(sys.stdin).get('results',[])))"; }
    jq_first_id() { python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])"; }
    urlenc() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"; }

    upsert_resource() {
      local endpoint="$1" name="$2" payload="$3"
      local resp count
      resp=$(aap_get "${endpoint}?name=$(urlenc "${name}")")
      count=$(echo "$resp" | jq_count)
      if [ "$count" = "0" ]; then
        aap_post "$endpoint" "$payload" | python3 -m json.tool
        echo "Created ${endpoint} '${name}'"
      else
        local rid
        rid=$(echo "$resp" | jq_first_id)
        aap_patch "${endpoint}${rid}/" "$payload" | python3 -m json.tool
        echo "Updated ${endpoint} '${name}' (id=${rid})"
      fi
    }

    attach_credential_to_template() {
      local cred_name="$1"
      local tmpl_name="$2"
      echo "Attaching credential '${cred_name}' to template '${tmpl_name}'"
      local cred_id
      cred_id=$(aap_get "/credentials/?name=$(urlenc "${cred_name}")" | jq_first_id)
      local tmpl_id
      tmpl_id=$(aap_get "/job_templates/?name=$(urlenc "${tmpl_name}")" \
        | python3 -c "import sys,json; r=json.load(sys.stdin)['results']; print(r[0]['id'] if r else '')")
      if [ -n "$tmpl_id" ]; then
        local http_code
        http_code=$(curl -s $CURL_TLS_FLAG -o /dev/null -w '%{http_code}' -X POST \
          "${AAP_HOST}${AAP_PREFIX}/job_templates/${tmpl_id}/credentials/" \
          -H "Authorization: Bearer ${AAP_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"id\": ${cred_id}}")
        if [ "$http_code" = "204" ] || [ "$http_code" = "400" ]; then
          echo "Credential '${cred_name}' attached to template '${tmpl_name}' (HTTP ${http_code})"
        else
          echo "ERROR: failed to attach credential to '${tmpl_name}' (HTTP ${http_code})" && exit 1
        fi
      else
        echo "WARNING: template '${tmpl_name}' not found, skipping credential attachment"
      fi
    }

    attach_credential_to_templates() {
      local cred_name="$1"
      shift
      local tmpl_name
      for tmpl_name in "$@"; do
        [ -n "$tmpl_name" ] || continue
        attach_credential_to_template "${cred_name}" "${tmpl_name}"
      done
    }

    template_id_by_name() {
      aap_get "/job_templates/?name=$(urlenc "$1")" \
        | python3 -c "import sys,json; r=json.load(sys.stdin)['results']; print(r[0]['id'] if r else '')"
    }

    gitea_commit_playbook() {
      local pb_file="$1"
      local pb_name
      pb_name=$(basename "$pb_file")
      local api="${GITEA_URL}/api/v1/repos/{{ .Values.gitea.adminUser }}/generated-playbooks/contents/playbooks/${pb_name}"
      local content sha
      content=$(base64 -w0 "$pb_file" 2>/dev/null || base64 "$pb_file" | tr -d '\n')
      sha=$(curl -fs "$api" -H "Authorization: token ${GITEA_TOKEN}" \
        | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
      if [ -n "$sha" ]; then
        curl -fs -X PUT "$api" -H "Authorization: token ${GITEA_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"content\":\"${content}\",\"message\":\"seed ${pb_name}\",\"sha\":\"${sha}\"}" >/dev/null
      else
        curl -fs -X POST "$api" -H "Authorization: token ${GITEA_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"content\":\"${content}\",\"message\":\"seed ${pb_name}\"}" >/dev/null
      fi
      echo "Seeded playbooks/${pb_name} into Gitea generated-playbooks"
    }

    upsert_template_for_playbook() {
      local pb_name="$1"
      local tmpl_name="${pb_name%.*}"
      local base_id proj_id existing tmpl_id patch
      base_id=$(template_id_by_name "${BASE_TMPL}")
      if [ -z "$base_id" ]; then
        echo "WARNING: base template '${BASE_TMPL}' not found, cannot create '${tmpl_name}'"
        return 0
      fi
      proj_id=$(aap_get "/projects/?name=$(urlenc "${PROJ_NAME}")" \
        | python3 -c "import sys,json; r=json.load(sys.stdin)['results']; print(r[0]['id'] if r else '')")
      existing=$(template_id_by_name "${tmpl_name}")
      if [ -z "$existing" ]; then
        tmpl_id=$(aap_post "/job_templates/${base_id}/copy/" "{\"name\": \"${tmpl_name}\"}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
        echo "Created job template '${tmpl_name}' (id=${tmpl_id})"
      else
        tmpl_id="$existing"
        echo "Job template '${tmpl_name}' exists (id=${tmpl_id})"
      fi
      patch="{\"playbook\": \"playbooks/${pb_name}\", \"ask_variables_on_launch\": true"
      [ -n "$proj_id" ] && patch="${patch}, \"project\": ${proj_id}"
      patch="${patch}}"
      aap_patch "/job_templates/${tmpl_id}/" "$patch" | python3 -m json.tool
      attach_credential_to_template "${EFFECTIVE_CRED_NAME}" "${tmpl_name}"
    }

    sync_project_and_wait() {
      local proj_id update_id status
      proj_id=$(aap_get "/projects/?name=$(urlenc "${PROJ_NAME}")" | jq_first_id)
      update_id=$(aap_post "/projects/${proj_id}/update/" "{}" \
        | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
      if [ -z "$update_id" ]; then
        echo "WARNING: could not trigger project sync for ${PROJ_NAME}"
        return 0
      fi
      echo "Waiting for project sync ${update_id} to complete..."
      for _ in $(seq 1 30); do
        status=$(aap_get "/project_updates/${update_id}/" \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
        case "$status" in
          successful) echo "Project sync complete"; return 0 ;;
          failed|error|canceled) echo "WARNING: project sync ${status}"; return 0 ;;
        esac
        sleep 4
      done
      echo "WARNING: project sync did not finish in time"
    }

    # Commit all playbooks to Gitea, sync the project so AAP discovers the new
    # files, then create/patch a job template for each. AAP validates a template's
    # playbook field against the project's last synced playbook list, so the sync
    # must happen between the commit and the template patch.
    seed_demo_playbooks() {
      local pb_file pb_name found=0
      for pb_file in /playbooks/*.yaml; do
        [ -e "$pb_file" ] || continue
        found=1
        gitea_commit_playbook "$pb_file"
      done
      if [ "$found" = "0" ]; then
        echo "WARNING: no playbooks mounted at /playbooks, skipping seed"
        return 0
      fi
      sync_project_and_wait
      for pb_file in /playbooks/*.yaml; do
        [ -e "$pb_file" ] || continue
        pb_name=$(basename "$pb_file")
        upsert_template_for_playbook "$pb_name"
      done
    }

    if [ "$MULTICLUSTER_ENABLED" = "true" ]; then
      PROXY_URL="${RHACM_CLUSTER_PROXY_URL}"
      HUB_TOKEN_VAL="${RHACM_HUB_TOKEN_VAL}"
      CRED_TYPE_NAME="{{ .Values.aapCredential.multicluster.credentialTypeName }}"
      MC_CRED_NAME="{{ .Values.aapCredential.multicluster.credentialName }}"

      [ -z "$PROXY_URL" ] && echo "ERROR: multicluster.clusterProxyUrl is required" && exit 1
      [ -z "$HUB_TOKEN_VAL" ] && echo "ERROR: multicluster.hubToken is required" && exit 1

      echo "Creating AAP Custom Credential Type '${CRED_TYPE_NAME}'"
      INPUT_CONFIG='{"fields": [{"id": "cluster_proxy_url", "type": "string", "label": "Cluster Proxy HUB URL"}, {"id": "hub_token", "type": "string", "label": "Cluster HUB Token", "secret": true}], "required": ["cluster_proxy_url", "hub_token"]}'
      INJECTOR_CONFIG='{"extra_vars": {"hub_url": "{{ "{{" }} cluster_proxy_url {{ "}}" }}", "token_acm": "{{ "{{" }} hub_token {{ "}}" }}"}}'

      CT_RESP=$(aap_get "/credential_types/?name=$(urlenc "${CRED_TYPE_NAME}")")
      CT_EXISTING=$(echo "$CT_RESP" | jq_count)

      CT_INPUTS="{\"inputs\": ${INPUT_CONFIG}, \"injectors\": ${INJECTOR_CONFIG}}"
      if [ "$CT_EXISTING" = "0" ]; then
        CT_ID=$(aap_post "/credential_types/" \
          "{\"name\": \"${CRED_TYPE_NAME}\", \"kind\": \"cloud\", \"inputs\": ${INPUT_CONFIG}, \"injectors\": ${INJECTOR_CONFIG}}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
        echo "Created credential type '${CRED_TYPE_NAME}' (id=${CT_ID})"
      else
        CT_ID=$(echo "$CT_RESP" | jq_first_id)
        aap_patch "/credential_types/${CT_ID}/" "$CT_INPUTS" | python3 -m json.tool
        echo "Updated credential type '${CRED_TYPE_NAME}' (id=${CT_ID})"
      fi

      MC_INPUTS="{\"cluster_proxy_url\": \"${PROXY_URL}\", \"hub_token\": \"${HUB_TOKEN_VAL}\"}"
      upsert_resource "/credentials/" "${MC_CRED_NAME}" \
        "{\"name\": \"${MC_CRED_NAME}\", \"credential_type\": ${CT_ID}, \"organization\": ${ORG_ID}, \"inputs\": ${MC_INPUTS}}"

      attach_credential_to_templates "${MC_CRED_NAME}" "${BASE_TMPL}" ${REMEDIATION_TMPLS}

    else
      SA_NAMESPACE="{{ .Values.aapCredential.saNamespace | default .Release.Namespace }}"
      API_SERVER="{{ .Values.aapCredential.apiServer }}"
      CRED_NAME="{{ .Values.aapCredential.credentialName | default "hub-remediation" }}"
      SA_NAME=aap-remediation
      CRED_TYPE_K8S_BEARER=3
      MAX_RETRIES=10
      RETRY_DELAY=3

      echo "Waiting for token to be populated..."
      for _ in $(seq 1 "${MAX_RETRIES}"); do
        TOKEN=$(oc get secret "${SA_NAME}-token" -n "${SA_NAMESPACE}" \
          -o jsonpath='{.data.token}' 2>/dev/null || true)
        [ -n "$TOKEN" ] && break
        sleep "${RETRY_DELAY}"
      done
      [ -z "$TOKEN" ] && echo "ERROR: token not populated after waiting" && exit 1
      TOKEN=$(echo "$TOKEN" | base64 -d)

      INPUTS="{\"host\": \"${API_SERVER}\", \"bearer_token\": \"${TOKEN}\", \"verify_ssl\": false}"
      upsert_resource "/credentials/" "${CRED_NAME}" \
        "{\"name\": \"${CRED_NAME}\", \"credential_type\": ${CRED_TYPE_K8S_BEARER}, \"organization\": ${ORG_ID}, \"inputs\": ${INPUTS}}"

      attach_credential_to_templates "${CRED_NAME}" "${BASE_TMPL}" ${REMEDIATION_TMPLS}
    fi

    GITEA_URL="http://gitea.{{ .Release.Namespace }}.svc:3000"
    PROJ_NAME="lightspeed-generated"
    PROJ_SCM_URL="${GITEA_URL}/{{ .Values.gitea.adminUser }}/generated-playbooks.git"

    upsert_resource "/projects/" "${PROJ_NAME}" \
      "{\"name\": \"${PROJ_NAME}\", \"organization\": ${ORG_ID}, \"scm_type\": \"git\", \"scm_url\": \"${PROJ_SCM_URL}\", \"scm_branch\": \"main\", \"scm_update_on_launch\": false}"

    if [ "$MULTICLUSTER_ENABLED" = "true" ]; then
      EFFECTIVE_CRED_NAME="${MC_CRED_NAME}"
    else
      EFFECTIVE_CRED_NAME="${CRED_NAME}"
    fi
    seed_demo_playbooks

    echo "AAP credential setup complete"
{{- end }}
