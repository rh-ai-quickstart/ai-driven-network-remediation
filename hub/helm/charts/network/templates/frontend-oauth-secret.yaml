{{- if and .Values.global.frontendAuth.enabled .Values.frontend.enabled }}
{{- $frontendName := printf "%s-frontend" (include "network.fullname" .) }}
{{- $existingFrontend := lookup "v1" "Secret" .Release.Namespace (printf "%s-oauth" $frontendName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $frontendName }}-oauth
  labels:
    {{- include "network.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: Opaque
data:
  {{- if and $existingFrontend $existingFrontend.data (index $existingFrontend.data "cookie-secret") }}
  cookie-secret: {{ index $existingFrontend.data "cookie-secret" }}
  {{- else }}
  cookie-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
