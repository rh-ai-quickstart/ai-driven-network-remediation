# Seeds every playbook under files/playbooks/ so the AAP credential hook can
# commit them to Gitea and create a matching job template. Add a playbook by
# dropping a *.yaml file in that directory and redeploying.
{{- if .Values.aapCredential.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "network.fullname" . }}-aap-demo-playbooks
  labels:
    {{- include "network.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
data:
{{ (.Files.Glob "files/playbooks/*.yaml").AsConfig | indent 2 }}
{{- end }}
