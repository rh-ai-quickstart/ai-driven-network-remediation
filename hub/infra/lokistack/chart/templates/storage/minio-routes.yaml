{{- if .Values.minio.enabled }}
{{- if .Values.minio.routes.api.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  to:
    kind: Service
    name: minio-service
    weight: 100
  port:
    targetPort: api
  wildcardPolicy: None
  {{- if .Values.minio.routes.api.tls }}
  tls:
    termination: {{ .Values.minio.routes.api.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.minio.routes.api.tls.insecureEdgeTerminationPolicy }}
  {{- end }}
{{- end }}
{{- if .Values.minio.routes.ui.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  to:
    kind: Service
    name: minio-service
    weight: 100
  port:
    targetPort: ui
  wildcardPolicy: None
  {{- if .Values.minio.routes.ui.tls }}
  tls:
    termination: {{ .Values.minio.routes.ui.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.minio.routes.ui.tls.insecureEdgeTerminationPolicy }}
  {{- end }}
{{- end }}
{{- end }}
