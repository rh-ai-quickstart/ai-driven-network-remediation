# LokiStack Helm Chart - Default Values
#
# Usage: helm install lokistack ./chart -n <namespace>
#
# Environment overrides (use --set):
#   Production:  --set minio.enabled=false --set lokistack.size=1x.medium
#                --set minio.endpoint=https://s3.us-east-1.amazonaws.com
#                --set minio.bucketName=production-loki-logs
#                --set minio.credentials.rootUser=<key>
#                --set minio.credentials.rootPassword=<secret>
#                --set grafana.replicas=2
#   CI/CD:       --set operators.loki.enabled=false
#                --set operators.operatorGroup.enabled=false

# Cluster apps domain (auto-discovered on OpenShift, set manually for helm template or non-OpenShift)
clusterDomain: ""

# Operator configuration
operators:
  # Set to false if OperatorGroup already exists in the namespace
  operatorGroup:
    enabled: true

  # Set to false if Loki Operator is already installed
  loki:
    enabled: true
    channel: stable
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic

# MinIO / S3 storage configuration
# For production, set enabled: false and configure endpoint for external S3
minio:
  enabled: true
  replicas: 1
  image:
    repository: quay.io/minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  bucketName: loki
  # When minio.enabled=true, endpoint is auto-populated; set for external S3
  endpoint: ""
  region: us-east-1
  credentials:
    rootUser: minio
    rootPassword: minio123

  persistence:
    enabled: true
    storageClass: gp3-csi
    size: 20Gi

  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 1Gi

  service:
    type: ClusterIP
    apiPort: 9000
    uiPort: 9090

  routes:
    api:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    ui:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

# LokiStack configuration
lokistack:
  name: logging-loki
  # Options: 1x.extra-small (dev), 1x.small, 1x.medium (production)
  size: 1x.extra-small

  storage:
    secret:
      name: logging-loki-s3
      type: s3

    schemas:
      - version: v13
        effectiveDate: "2024-01-01"

    storageClassName: gp3-csi

  tenants:
    mode: openshift-logging

  limits:
    global:
      queries:
        queryTimeout: 3m
        maxVolumeSeries: 1000

# Grafana configuration
grafana:
  enabled: true
  # Set replicas: 2 for production HA
  replicas: 1

  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent

  adminUser: admin
  adminPassword: admin

  auth:
    anonymous:
      enabled: false
      orgRole: Viewer

  # Loki datasources — authenticated via grafana-loki-reader service account token
  # URLs are auto-constructed from lokistack.name and the release namespace
  datasources:
    loki:
      application:
        enabled: true
        name: Loki-Application
        isDefault: true
        tlsSkipVerify: true

      infrastructure:
        enabled: true
        name: Loki-Infrastructure
        isDefault: false
        tlsSkipVerify: true

      audit:
        enabled: false
        name: Loki-Audit
        isDefault: false
        tlsSkipVerify: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 3000
    annotations:
      service.alpha.openshift.io/serving-cert-secret-name: grafana-tls

  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

  rbac:
    enabled: true
    serviceAccount:
      create: true
      name: grafana
    lokiReader:
      enabled: true
      serviceAccountName: grafana-loki-reader

# Test log generator (enable for dev/testing)
testLogGenerator:
  enabled: false
  replicas: 1
  image:
    repository: busybox
    tag: latest
  interval: 5
