# KServe InferenceService for ran-ml-service (Mantis AD predictor).
#
# Prerequisites:
#   1. Weights published to HuggingFace: TomerG2/mantis-ad-telecomts
#   2. Predictor image pushed: quay.io/rh-ai-quickstart/noc-ran-ml-service:<tag>
#
# Deploy:
#   oc apply -f model-serving/ran-ml-service/deploy/inferenceservice.yaml
#
# Then wire the endpoint into the hub chart.
# {.status.url} is in-cluster only. Callers outside the cluster use the Route
# applied by publish-and-deploy.sh (ran-ml-service-external):
#   oc get route ran-ml-service-external -n model-serving \
#     -o jsonpath='https://{.spec.host}/v1/detect'
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ran-ml-service
  namespace: model-serving
  labels:
    app.kubernetes.io/name: ran-ml-service
    app.kubernetes.io/part-of: ai-driven-network-remediation
  annotations:
    # Disable Istio sidecar — ran-ml-service manages its own HTTP server.
    sidecar.istio.io/inject: "false"
spec:
  predictor:
    # predictor.storageUri is not in this cluster's CRD (it gets pruned).
    # storageUris is rejected here because the default storage-initializer
    # has supportsMultiModelDownload: false. Custom predictors use STORAGE_URI
    # so KServe injects a single-URI init container that mounts /mnt/models.
    containers:
      - name: kserve-container
        # Default matches Makefile REGISTRY/VERSION. publish-and-deploy.sh
        # substitutes the image ref from those env vars before `oc apply`.
        image: quay.io/rh-ai-quickstart/noc-ran-ml-service:0.1.5
        imagePullPolicy: Always
        env:
          - name: TASK
            value: detect
          - name: MANTIS_MODEL_PATH
            value: /mnt/models/mantis_pretrained_ad.pt
          - name: STORAGE_URI
            # TODO: replace with rh-ai-quickstart/mantis-ad-telecomts once the org HF repo is created
            value: hf://TomerG2/mantis-ad-telecomts
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
