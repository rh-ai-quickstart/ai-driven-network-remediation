name: Deploy Kind cluster
description: Install Kind and create a local Kubernetes cluster

runs:
  using: composite
  steps:
    # This action builds the local images. The RAN chatbot image generates
    # TelecomTS fixtures during its build, which requires uv.
    - name: Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Clean up any pre-existing Kind cluster
      run: |
        kind delete cluster 2>/dev/null || true
        docker rm -f kind-registry 2>/dev/null || true
      shell: bash

    - name: Install oc client
      run: |
        curl -sSLo oc.tar.gz https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz
        tar -xf oc.tar.gz -C /usr/local/bin oc
        oc version --client
      shell: bash

    - name: Install Kind
      run: go install sigs.k8s.io/kind@v0.30.0
      shell: bash

    - name: Create Kind cluster with local registry
      run: bash ./scripts/ci/kind-with-registry.sh
      shell: bash

    - name: Print cluster info
      run: oc cluster-info
      shell: bash

    - name: Install Llama Stack K8s operator
      run: |
        oc apply -k "https://github.com/ogx-ai/ogx-k8s-operator/config/default?ref=v0.9.0"
        oc wait --for=condition=Available \
          deployment/llama-stack-k8s-operator-controller-manager \
          -n llama-stack-k8s-operator-system --timeout=180s
      shell: bash

    - name: Build local images
      run: make build-all-images REGISTRY=localhost:5001
      shell: bash

    - name: Push local images to the local registry
      run: make push-all-images REGISTRY=localhost:5001 PUSH_EXTRA_ARGS="--tls-verify=false"
      shell: bash

    - name: Install edge chart (nginx + healer, CLF off)
      run: |
        # Kind has no OpenShift GitOps / Logging. Use the same edge/helm chart as
        # edge via Helm (EDGE_GITOPS=helm), same chart as make deploy. Disable healer when network
        # images were not built (telco-only Kind runs).
        HEALER_ENABLED=true
        if [ "${ENABLE_NETWORK_REMEDIATION:-true}" = "false" ]; then
          HEALER_ENABLED=false
        fi
        make edge-deploy \
          CLUSTER_COUNT=1 \
          EDGE_GITOPS=helm \
          EDGE_NAMESPACE=dark-noc-edge \
          REGISTRY=localhost:5001 \
          VERSION="${VERSION:-0.1.5}" \
          CLUSTER_LOG_FORWARDER_ENABLED=false \
          EDGE_HEALER_ENABLED="${HEALER_ENABLED}"
        oc wait --for=condition=available deployment/edge-nginx -n dark-noc-edge --timeout=120s
        if [ "${HEALER_ENABLED}" = "true" ]; then
          oc wait --for=condition=available deployment/edge-fast-path-runner -n dark-noc-edge --timeout=120s
          oc wait --for=condition=available deployment/edge-fast-path-watcher -n dark-noc-edge --timeout=120s
        fi
      shell: bash

    - name: Prepare in-cluster kubeconfig for edge namespace
      run: |
        CP_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' kind-control-plane)
        cp "$HOME/.kube/config" /tmp/edge-kubeconfig
        sed -i "s|https://127.0.0.1:[0-9]*|https://${CP_IP}:6443|g" /tmp/edge-kubeconfig
      shell: bash

    - name: Build and push AAP mock image
      run: make build-push-aap-mock REGISTRY=localhost:5001 PUSH_EXTRA_ARGS="--tls-verify=false"
      shell: bash

    - name: Build and push ServiceNow mock image
      run: make build-push-servicenow-mock REGISTRY=localhost:5001 PUSH_EXTRA_ARGS="--tls-verify=false"
      shell: bash

    - name: Pre-load LlamaStack image into Kind
      run: |
        docker pull ogxai/distribution-starter:0.6.1
        kind load docker-image ogxai/distribution-starter:0.6.1
      shell: bash

    - name: Helm Install
      run: |
        make helm-install REGISTRY=localhost:5001 ROUTES_ENABLED=false ENABLE_KAFKA_UI=false \
          ENABLE_SERVICENOW_MOCK=true AUTO_INGEST_ON_STARTUP=false \
          HELM_EXTRA_ARGS="\
            --set waitImage=curlimages/curl:8.14.1 \
            --set network.waitImage=curlimages/curl:8.14.1 \
            --set telco.ranAnomalyDetector.enabled=false \
            --set network.mcpSecrets.openshift.create=true \
            --set-file network.mcpSecrets.openshift.kubeconfig=/tmp/edge-kubeconfig \
            --set network.mcp-servers.mcp-servers.noc-lokistack.enabled=false \
            --set network.mcp-servers.mcp-servers.noc-aap.env.AAP_URL=http://aap-mock.hub.svc:8080 \
            --set network.mcp-servers.mcp-servers.noc-aap.env.AAP_VERIFY_SSL=false \
            --set kafka.kafka.storage.storageClass=standard \
            --set kafka.kafka.storage.size=256Mi \
            --set kafka.kafka.retention.hours=1 \
            --set kafka.kafka.resources.requests.cpu=100m \
            --set kafka.kafka.resources.requests.memory=256Mi \
            --set kafka.kafka.resources.limits.cpu=500m \
            --set kafka.kafka.resources.limits.memory=512Mi \
            --set-string kafka.kafka.jvmHeapOpts='-Xmx384m -Xms256m'"
      shell: bash

    - name: Wait for Kafka topics to be created
      run: |
        oc wait --for=condition=complete job/kafka-create-topics -n hub --timeout=120s
      shell: bash

    - name: Wait for MCP pods to be ready
      if: env.ENABLE_NETWORK_REMEDIATION != 'false'
      run: |
        for label in noc-kafka noc-aap noc-servicenow noc-openshift; do
          echo "Waiting for ${label}..."
          oc wait --for=condition=Ready pod -l "app.kubernetes.io/name=${label}" -n hub --timeout=120s
        done
      shell: bash
