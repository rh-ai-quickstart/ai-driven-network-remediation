name: (nightly) Telco ORAN e2e on OpenShift

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ocp-telco-oran-nightly
  cancel-in-progress: false

env:
  NAMESPACE: ci-hub-telco-oran
  REGISTRY: ${{ vars.QUAY_REPOSITORY }}
  VERSION: ${{ github.sha }}
  CONTAINER_TOOL: docker
  ADNR_CLASSIFY_INFERENCE_URL: http://ran-rca-ml-service-predictor.model-serving.svc.cluster.local/v1/classify

jobs:
  telco-e2e-ocp:
    name: Run Telco ORAN e2e tests on OpenShift
    runs-on: ubuntu-latest
    steps:
      - name: Validate OCP_TOKEN and OCP_SERVER secrets
        shell: bash
        env:
          OCP_TOKEN: ${{ secrets.OCP_TOKEN }}
          OCP_SERVER: ${{ secrets.OCP_SERVER }}
        run: |
          if [ -z "${OCP_TOKEN}" ]; then
            echo "OCP_TOKEN secret is missing or empty. Set it in repository or organization secrets."
            exit 1
          fi
          if [ -z "${OCP_SERVER}" ]; then
            echo "OCP_SERVER secret is missing or empty. Set it in repository or organization secrets."
            exit 1
          fi

      - name: Validate ADNR_LLM_ID, ADNR_LLM_URL and ADNR_LLM_TOKEN
        shell: bash
        env:
          ADNR_LLM_ID: ${{ vars.ADNR_LLM_ID }}
          ADNR_LLM_URL: ${{ vars.ADNR_LLM_URL }}
          ADNR_LLM_TOKEN: ${{ secrets.ADNR_LLM_TOKEN }}
        run: |
          if [ -z "${ADNR_LLM_ID}" ]; then
            echo "ADNR_LLM_ID variable is missing or empty. Set it in repository or organization variables."
            exit 1
          fi
          if [ -z "${ADNR_LLM_URL}" ]; then
            echo "ADNR_LLM_URL variable is missing or empty. Set it in repository or organization variables."
            exit 1
          fi
          if [ -z "${ADNR_LLM_TOKEN}" ]; then
            echo "ADNR_LLM_TOKEN secret is missing or empty. Set it in repository or organization secrets."
            exit 1
          fi

      - name: Print run context
        run: |
          echo "workflow : ${{ github.workflow }}"
          echo "ref      : ${{ github.ref }}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install oc client
        shell: bash
        run: |
          curl -sSLo oc.tar.gz https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xf oc.tar.gz -C /usr/local/bin oc
          oc version --client

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Validate image registry credentials
        shell: bash
        env:
          QUAY_USER: ${{ vars.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          for name in REGISTRY QUAY_USER QUAY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "${name} is missing or empty. Set the Quay repository, user, and token in repository or organization settings."
              exit 1
            fi
          done

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push RCA images from this commit
        shell: bash
        run: |
          make build-ran-rca-image build-ran-chatbot-image build-ran-ml-service-image
          docker push "${REGISTRY}/noc-ran-rca-service:${VERSION}"
          docker push "${REGISTRY}/noc-ran-chatbot-service:${VERSION}"
          docker push "${REGISTRY}/noc-ran-ml-service:${VERSION}"

      - name: Log into the cluster
        shell: bash
        run: |
          oc login --token=$OCP_TOKEN --server=$OCP_SERVER
        env:
          OCP_TOKEN: ${{ secrets.OCP_TOKEN }}
          OCP_SERVER: ${{ secrets.OCP_SERVER }}

      - name: Deploy RCA classifier from this commit
        shell: bash
        run: |
          TASK=classify SKIP_HF_UPLOAD=1 SKIP_BUILD=1 \
            IMAGE="${REGISTRY}/noc-ran-ml-service:${VERSION}" \
            ./model-serving/shared-ml-predictor/deploy/publish-and-deploy.sh

      - name: Resolve shared detector URL
        shell: bash
        env:
          CONFIGURED_DETECT_URL: ${{ vars.ADNR_DETECT_INFERENCE_URL }}
        run: |
          detect_url="${CONFIGURED_DETECT_URL}"
          if [ -z "${detect_url}" ]; then
            predictor_url="$(oc get inferenceservice ran-ml-service \
              -n model-serving -o jsonpath='{.status.url}' 2>/dev/null || true)"
            if [ -n "${predictor_url}" ]; then
              detect_url="${predictor_url%/}/v1/detect"
            fi
          fi
          if [ -z "${detect_url}" ]; then
            echo "ADNR_DETECT_INFERENCE_URL is not configured and the shared ran-ml-service URL could not be discovered."
            exit 1
          fi
          detect_url="${detect_url%/}"
          case "${detect_url}" in
            */v1/detect) ;;
            *) detect_url="${detect_url}/v1/detect" ;;
          esac
          echo "ADNR_DETECT_INFERENCE_URL=${detect_url}" >> "${GITHUB_ENV}"

      - name: Pre-cleanup
        continue-on-error: true
        shell: bash
        run: |
          make helm-erase-hub

      - name: Helm install
        shell: bash
        run: |
          make helm-install \
            ENABLE_TELCO_ORAN=true \
            ENABLE_NETWORK_REMEDIATION=false \
            EDGE_RBAC_ENABLED=false \
            ROUTES_ENABLED=false \
            AUTO_INGEST_ON_STARTUP=false \
            HELM_EXTRA_ARGS="-f hub/helm/values-ci-rca.yaml --set-string telco.ranRcaService.image=${REGISTRY}/noc-ran-rca-service:${VERSION} --set-string telco.ranChatbotService.image=${REGISTRY}/noc-ran-chatbot-service:${VERSION}"
        env:
          ADNR_LLM_ID: ${{ vars.ADNR_LLM_ID }}
          ADNR_LLM_URL: ${{ vars.ADNR_LLM_URL }}
          ADNR_LLM_TOKEN: ${{ secrets.ADNR_LLM_TOKEN }}
          ADNR_DETECT_TOKEN: ${{ secrets.ADNR_DETECT_TOKEN }}

      - name: Generate TelecomTS fixtures
        run: make generate-fixtures

      - name: Run Telco ORAN integration tests
        shell: bash
        run: |
          make telco-integration-tests

      - name: Probe RCA classification through remediation and chat
        shell: bash
        env:
          RCA_REAL_E2E: '1'
          RCA_EXPECTED_MODE: used
          RCA_GUIDANCE_THRESHOLD: '0.6'
          RCA_DEPLOYMENT_NAMESPACE: ci-hub-telco-oran
          RCA_EXPECTED_CLASSIFY_URL: http://ran-rca-ml-service-predictor.model-serving.svc.cluster.local/v1/classify
          RAN_RCA_SERVICE_URL: http://localhost:8013
          RAN_REMEDIATION_SERVICE_URL: http://localhost:8014
          RAN_CHATBOT_SERVICE_URL: http://localhost:8008
        run: |
          oc port-forward -n "${NAMESPACE}" svc/hub-ran-rca-service 8013:8003 &
          rca_pid=$!
          oc port-forward -n "${NAMESPACE}" svc/hub-ran-remediation-service 8014:8004 &
          remediation_pid=$!
          oc port-forward -n "${NAMESPACE}" svc/hub-ran-chatbot-service 8008:8003 &
          chatbot_pid=$!
          trap 'kill "$rca_pid" "$remediation_pid" "$chatbot_pid" 2>/dev/null || true' EXIT
          export RCA_EVIDENCE_FILE="${RUNNER_TEMP}/rca-nightly-evidence.json"
          cd hub/integration-tests
          uv run pytest tests/telco/test_rca_real_e2e.py -v
